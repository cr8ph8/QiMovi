name: Apply reviewed cross-app source patch
on:
  push:
    branches: [feat/cross-app-brand-workflow]
    paths: ['.github/cross-brand-*.b64', '.github/workflows/apply-cross-brand.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'cr8ph8/QiMovi' && github.ref == 'refs/heads/feat/cross-app-brand-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply exact reviewed patch to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, base64, gzip, hashlib, subprocess, os
          encoded = ''.join(pathlib.Path(f'.github/cross-brand-{i}.b64').read_text() for i in range(3))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 44607
          assert hashlib.sha256(patch).hexdigest() == '11965d523ba97384f24b71a4980df4d631e6849cb1600f08bb4221f46620c535'
          expected = {'README.md','docs/brand-financing.md','docs/cross-app-brand-planning.md','local/contracts/brand-financing.mjs','local/contracts/brand-scanner.mjs','local/server/brand-financing.mjs','local/server/http.mjs','src/drifter/App.tsx','src/drifter/BrandFinancingPanel.tsx','src/drifter/BrandWorkflowPanel.tsx','src/drifter/CreativeProjectWorkspace.tsx','src/drifter/ProductionBudgetPanel.tsx','src/drifter/brandFinancingApi.ts','tests/brand-financing.test.mjs','tests/brand-workflow-ui.test.tsx'}
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cross-brand.patch'
          target.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply','--index',str(target)],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()) == expected
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: connect brand planning across QiMovi workflows and local writer bridge'
          git push origin HEAD:refs/heads/feat/cross-app-brand-workflow
